name: limpio_dart
description: Limpio - finanzas personales USD/VES
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.2
  intl: any
  uuid: ^4.5.1
  flutter_slidable: ^3.1.2
  google_mlkit_text_recognition: ^0.15.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  image_cropper: ^8.0.2
  image: ^4.5.4
  u_credit_card: ^1.6.0
  receive_sharing_intent: ^1.8.1
  tutorial_coach_mark: ^1.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logos/icon.jpg
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/logos/icon.jpg

flutter_native_splash:
  color: '#F4F4F5'
  image: assets/logos/icon-splash.png
  android: true
  ios: false
  android_12:
    color: '#F4F4F5'
    image: assets/logos/icon-splash.png

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/backgrounds/
    - assets/Cards/
